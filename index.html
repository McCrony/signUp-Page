<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="stylesheet.css">

</head>

<body>

    <div class="container">

        <!-- LEFT SIDE -->
        <div class="left">
            <div class="logo-box">
                <img src="/images/odin.png" alt="Odin Logo">
                <h1>ODIN</h1>
            </div>
            <p class="credit">Photo by Halie West on Unsplash</p>
        </div>

        <!-- RIGHT SIDE -->
        <div class="right">

            <div class="intro">
                <p>
                    This is not a real online service! You know you need something
                    like this in your life to help you realize your deepest dreams.
                    Sign up <em>now</em> to get started.
                </p>
                <p>You <em>know</em> you want to.</p>
            </div>

            <div class="form-section">
                <h2>Let's do this!</h2>

                <form>
                    <div class="form-row">

                        <div class="form-group">
                            <label>FIRST NAME</label>
                            <input type="text" placeholder="Thor">
                        </div>

                        <div class="form-group">
                            <label>LAST NAME</label>
                            <input type="text" placeholder="Odinson">
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label>EMAIL</label>
                            <input type="email">
                        </div>

                        <div class="form-group">
                            <label>PHONE NUMBER</label>
                            <input type="tel">
                        </div>

                    </div>

                    <div class="form-row">

                        <div class="form-group">
                            <label>PASSWORD</label>
                            <input type="password" class="error">
                        </div>

                        <div class="form-group">
                            <label>CONFIRM PASSWORD</label>
                            <input type="password" class="error">
                        </div>

                    </div>

                </form>
            </div>

            <div class="action">
                <button>Create Account</button>
                <p>Already have an account? <a href="#">Log in</a></p>
            </div>

        </div>
    </div>

</body>

</html>
